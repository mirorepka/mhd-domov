name: Aktualizácia a nasadenie

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # každý deň ráno skontroluje nový cestovný poriadok
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stiahnuť dáta a postaviť sieť
        run: node tools/update-feeds.mjs
      - name: Uložiť nové GTFS do repozitára
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gtfs
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizácia cestovného poriadku DPB"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
